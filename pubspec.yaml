name: pika_patrol
description: "Patrol, track, and log pikas"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 3.5.0+335

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  firebase_storage: ^13.6.0
  firebase_app_check: ^0.4.8
  cloud_firestore: ^6.10.0

  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.2.0
  flutter_localizations:
    sdk: flutter
    version: ^0.0.0
  intl: ^0.20.3
  flutter_plugin_android_lifecycle: ^2.0.17
  cupertino_icons: ^2.0.0
  provider: ^6.0.5
  image_cropper: ^12.2.1
  image_picker: ^1.2.4
  gal: ^2.3.3
  image_picker_android: ^0.8.13
  image_picker_platform_interface: ^2.11.0
  file_picker: ^13.1.0
  shimmer: ^4.0.0
  liquid_swipe: ^3.1.0
  curved_navigation_bar: ^1.0.3
  record: ^7.1.1
  just_audio: ^0.10.6
  material_themes_widgets: ^1.15.0
  url_launcher: ^6.1.12 #requires sdk >= 3.0.0 <4.0.0
  chips_choice: ^3.0.0
  charcode: ^1.3.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  mime: ^2.0.0
  geolocator: ^14.1.1
  data_connection_checker_nulls: ^0.0.2
#  connectivity_plus: ^5.0.2
  shared_preferences: ^2.5.6
  permission_handler: ^13.0.2
  dash_flags: ^0.1.1
  gsheets: ^0.5.0
  deepcopy: ^1.1.2

  material_themes_manager: ^1.5.0
  path_provider: any
  googleapis: any
  googleapis_auth: any
  http: any
  path: any
  file: any
  flutter_dotenv: ^6.0.1
  webview_flutter: ^4.8.0
  package_info_plus: ^10.2.2
  cached_network_image: ^3.4.1
dependency_overrides:
  # TEMP: local copies until material_themes_widgets 1.15.0 and material_themes_manager 1.5.0 are on pub.dev. Delete this block after publishing.
  material_themes_widgets:
    path: ../flutter-material-themes-widgets
  material_themes_manager:
    path: ../flutter-material-themes-manager

dev_dependencies:
  flutter_test:
    sdk: flutter

  hive_generator: ^2.0.0
  build_runner: ^2.4.6
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

flutter:

  generate: true
  uses-material-design: true

  assets:
    - .env
    - assets/
    - assets/icons/
    - assets/images/
    - assets/audio/

flutter_icons:
  android: true
  image_path_android: "assets/icons/icon.png"
  ios: true
  image_path_ios: "assets/icons/icon_no_transparency.png"